name: NetDevOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  linting_and_validation:
    name: Validacion Sintactica y Linting
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependencias y linters
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible-lint requests pyyaml jinja2

      - name: Validar sintaxis de archivos YAML
        run: |
          yamllint 03_ansible_herramientas/ 04_iac_jinja2_yaml/

      - name: Validar Playbooks de Ansible
        run: |
          ansible-lint 03_ansible_herramientas/

  health_check_test:
    name: Prueba de Salud RESTCONF en Sandbox
    needs: linting_and_validation
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          pip install requests

      - name: Ejecutar script de verificacion de salud RESTCONF
        env:
          DEVNET_USER: ${{ secrets.DEVNET_USER }}
          DEVNET_PASS: ${{ secrets.DEVNET_PASS }}
        run: |
          python 05_devops_sre/verificar_salud.py
